# This workflow is managed by gh actions-lock.

name: Actions Dependencies

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  submit-dependencies:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jessehouwing/actions-dependency-submission@v1.0.15
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

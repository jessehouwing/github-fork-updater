# This workflow is managed by gh actions-lock.

name: Check for updates for all forks
on: 
  push:
    branches:
      - main 
  schedule:
    - cron: 7 0 * * 1-5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # needed to raise the issues for the repositories that have updates available
      issues: write
    outputs:
      update: ${{steps.update_step.outputs.update}}

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2.20.0
      with:
        egress-policy: audit

    - uses: actions/checkout@v7.0.1

    - id: get-token
      name: Resolve the tokens to use
      uses: $/.github/actions/resolve-tokens
      with:
        target-server-url: ${{ vars.TARGET_SERVER_URL }}
        use-github-app: ${{ vars.USE_GITHUB_APP }}
        app-id: ${{ secrets.GH_AUTOMATION_ID }}
        private-key: ${{ secrets.GH_AUTOMATION_PRIVATE_KEY }}
        target-org: ${{ vars.TARGET_ORG || github.repository_owner }}
        pat: ${{ secrets.PAT_GITHUB }}
        use-public-github-app: ${{ vars.USE_PUBLIC_GITHUB_APP }}
        public-app-id: ${{ secrets.GH_PUBLIC_APP_ID }}
        public-private-key: ${{ secrets.GH_PUBLIC_APP_PRIVATE_KEY }}
        public-org: ${{ vars.PUBLIC_GITHUB_ORG }}
        public-pat: ${{ secrets.PAT_GITHUB_PUBLIC }}

    - id: update_step
      shell: pwsh
      name: Check for updates
      env:
        ORG_NAME: ${{ vars.TARGET_ORG || github.repository_owner }}
        ISSUES_REPOSITORY: ${{ github.repository }}
        TARGET_TOKEN: ${{ steps.get-token.outputs.target-token }}
        SOURCE_TOKEN: ${{ steps.get-token.outputs.source-token }}
        TARGET_SERVER_URL: ${{ steps.get-token.outputs.target-server-url }}
      run: | 
        $updateResult = (.\updater.ps1 -orgName $env:ORG_NAME -userName "xxx" -targetToken $env:TARGET_TOKEN -sourceToken $env:SOURCE_TOKEN -targetServerUrl $env:TARGET_SERVER_URL -issuesRepository $env:ISSUES_REPOSITORY )
        
        if ($null -ne $updateResult) {
          $reposWithUpdates = $updateResult[-1]
          Write-Host "Are there any updates available? [$($reposWithUpdates.Count -gt 0)]"
          echo "update=$($reposWithUpdates.Count -gt 0)" >> $env:GITHUB_OUTPUT
        }

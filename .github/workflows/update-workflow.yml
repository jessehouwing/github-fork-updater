# This workflow is managed by gh actions-lock.

name: Update the fork
on: 
  issues:
    types: [labeled]

permissions: {}

jobs:
  update-fork:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'update-fork'
    permissions:
      contents: read
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2.20.0
      with:
        egress-policy: audit

    - name: Require administrator approval
      uses: actions-cool/check-user-permission@v2.4.0
      with:
        username: ${{ github.actor }}
        require: admin
        error-if-missing: true

    - id: target-repository
      name: Read target repository from approval issue
      shell: pwsh
      env:
        ISSUE_BODY: ${{ github.event.issue.body }}
        TARGET_ORG: ${{ vars.TARGET_ORG || github.repository_owner }}
      run: |
        $match = [regex]::Match($env:ISSUE_BODY, '(?s)<!--\s*fork-updater-approval:\s*(?<json>.*?)\s*-->')
        if (-not $match.Success) {
          throw "The issue body does not contain an approval snapshot."
        }
        try {
          $repository = ($match.Groups['json'].Value | ConvertFrom-Json -ErrorAction Stop).target
        }
        catch {
          throw "The approval snapshot does not contain valid JSON."
        }
        if ([string]::IsNullOrWhiteSpace($repository) -or $repository -notmatch '^[^/\s]+/[^/\s]+$') {
          throw "The approval snapshot does not identify a valid target repository."
        }
        if ($repository -notmatch "^$([regex]::Escape($env:TARGET_ORG))/") {
          throw "Target repository [$repository] is not in configured organization [$env:TARGET_ORG]."
        }
        "repository=$repository" >> $env:GITHUB_OUTPUT

    - uses: actions/checkout@v7.0.1

    - id: get-token
      name: Resolve the tokens to use
      uses: $/.github/actions/resolve-tokens
      with:
        target-server-url: ${{ vars.TARGET_SERVER_URL }}
        use-github-app: ${{ vars.USE_GITHUB_APP }}
        app-id: ${{ secrets.GH_AUTOMATION_ID }}
        private-key: ${{ secrets.GH_AUTOMATION_PRIVATE_KEY }}
        target-org: ${{ vars.TARGET_ORG || github.repository_owner }}
        target-repositories: |
          ${{ github.repository }}
          ${{ steps.target-repository.outputs.repository }}
        target-permissions: |
          contents: write
          issues: write
          actions: write
          administration: read
        pat: ${{ secrets.PAT_GITHUB }}
        use-public-github-app: ${{ vars.USE_PUBLIC_GITHUB_APP }}
        public-app-id: ${{ secrets.GH_PUBLIC_APP_ID }}
        public-private-key: ${{ secrets.GH_PUBLIC_APP_PRIVATE_KEY }}
        public-org: ${{ vars.PUBLIC_GITHUB_ORG }}
        public-pat: ${{ secrets.PAT_GITHUB_PUBLIC }}

    - env:
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
      run: |
       echo "Found the issue that triggered this event with number [$ISSUE_NUMBER]"
       echo "Found the issue title [$ISSUE_TITLE]"

    - env:
        ORG_NAME: ${{ vars.TARGET_ORG || github.repository_owner }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_ID: ${{ github.event.issue.number }}
        ISSUES_REPOSITORY: ${{ github.repository }}
        TARGET_TOKEN: ${{ steps.get-token.outputs.target-token }}
        SOURCE_TOKEN: ${{ steps.get-token.outputs.source-token }}
        TARGET_SERVER_URL: ${{ steps.get-token.outputs.target-server-url }}
      run: |
       .\update-fork.ps1 -orgName $env:ORG_NAME -userName "xxx" -targetToken $env:TARGET_TOKEN -sourceToken $env:SOURCE_TOKEN -targetServerUrl $env:TARGET_SERVER_URL -issueTitle "$env:ISSUE_TITLE" -issueId $env:ISSUE_ID -issuesRepository $env:ISSUES_REPOSITORY
      shell: pwsh
